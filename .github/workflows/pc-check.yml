name: Проверка мыши (ПК)
# Запуск вручную. Собирает программу под Linux из выбранной ветки, запускает на
# виртуальном экране и двигает мышь по сценарию tool/pc_scenario.txt.
# Снимки — в ветку pc-shots. Релиз не создаёт.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка'
        default: main
permissions:
  contents: write
concurrency:
  group: pc-check
  cancel-in-progress: true
jobs:
  pc:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Пакеты
        run: |
          for i in 1 2 3; do
            sudo timeout 300 apt-get -o Acquire::Retries=3 update -y && \
            sudo timeout 600 apt-get -o Acquire::Retries=3 install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev mpv xvfb imagemagick xdotool libayatana-appindicator3-dev ffmpeg && break
            sleep 10
          done
      - name: Сборка
        run: |
          flutter create . --project-name deep_cinema --org app.deepcinema --platforms=linux > build.log 2>&1
          sed -i 's/-Werror//g' linux/CMakeLists.txt
          flutter pub get >> build.log 2>&1
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          grep -E "error •" analyze.txt | head -30 | while read -r l; do echo "::error title=analyze::$l"; done || true
          flutter build linux --release --dart-define=DC_FOCUS_LOG=true >> build.log 2>&1 || { echo "::error title=Linux::$(tail -n 40 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }
      - name: Мышь и клавиатура
        run: |
          ffmpeg -loglevel error -f lavfi -i "testsrc2=size=1280x720:rate=25" -f lavfi -i "sine=frequency=440" -t 120 -c:v libx264 -preset ultrafast -c:a aac /tmp/test.mkv
          Xvfb :99 -screen 0 1600x900x24 &
          export DISPLAY=:99
          sleep 2
          bash tool/pc_check.sh
      - name: В ветку pc-shots
        if: always()
        run: |
          cd shots
          for f in *.png; do [ -f "$f" ] && convert "$f" -quality 82 "${f%.png}.jpg" && rm "$f"; done || true
          git init -q
          git config user.name "deep-cinema-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -q -b pc-shots
          git add -A
          git commit -qm "Мышь: ${{ inputs.ref }} $(date -u +%F\ %T)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pc-shots
