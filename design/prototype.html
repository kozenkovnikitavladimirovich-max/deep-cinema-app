<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Cinema — прототип</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
:root{--bg:#0b0b0e;--tx:#fff;--mu:rgba(255,255,255,.6);--gl:rgba(48,48,56,.55);--st:rgba(255,255,255,.14);--chip:rgba(255,255,255,.1);--btn:#f5f5f7;--btx:#111}
body.light{--bg:#e6ebdd;--tx:#1c1c1e;--mu:rgba(0,0,0,.55);--gl:rgba(255,255,255,.5);--st:rgba(255,255,255,.7);--chip:rgba(0,0,0,.06);--btn:#1c1c1e;--btx:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;overflow:hidden;user-select:none}
body.light{background:radial-gradient(700px 500px at 15% 25%,#d4ecd8,transparent 70%),radial-gradient(800px 600px at 85% 90%,#f7dccb,transparent 70%),#e6ebdd}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{position:fixed;inset:0;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.page::-webkit-scrollbar{width:0}
.glass{background:var(--gl);backdrop-filter:blur(28px) saturate(1.4);-webkit-backdrop-filter:blur(28px) saturate(1.4);border:1px solid var(--st)}
.mu{color:var(--mu)}
/* ── фокус ── */
[data-f]{transition:transform .18s ease,box-shadow .18s ease,background .18s,color .18s,outline-color .18s;outline:3px solid transparent;outline-offset:4px}
body.glassy [data-f].f{outline-color:var(--tx)}
body.tv [data-f].f{transform:scale(1.07);box-shadow:0 22px 44px rgba(0,0,0,.5);z-index:2;position:relative}
body.tv .btn[data-f].f,body.tv .row[data-f].f,body.tv .navi[data-f].f,body.tv .chipb[data-f].f,body.tv .opt[data-f].f{background:var(--btn)!important;color:var(--btx)!important;border-color:transparent!important}
body.tv .btn[data-f].f svg *{stroke:var(--btx);fill-opacity:1}
/* ── кнопки ── */
.btn{height:54px;padding:0 26px;border-radius:27px;display:inline-flex;align-items:center;gap:10px;font-size:18px;font-weight:700;white-space:nowrap}
.btn.pri{background:var(--btn);color:var(--btx)}
.btn.sec{background:var(--gl);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--st)}
.btn.rnd{width:54px;padding:0;justify-content:center}
.chipb{height:42px;padding:0 18px;border-radius:21px;background:var(--chip);border:1px solid var(--st);font-size:16px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.chipb.sel{background:rgba(255,255,255,.3)}
body.light .chipb.sel{background:rgba(0,0,0,.18)}
.chipb.ex{background:rgba(255,80,80,.25);text-decoration:line-through}
/* ── шапки ── */
#top-glassy{position:fixed;left:0;right:0;top:0;height:96px;display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:none}
#top-glassy>*{pointer-events:auto}
.logo{position:absolute;left:40px;top:28px;font-weight:900;font-size:22px;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#7c9cff,#c48bff)}
.navpill{display:flex;gap:4px;padding:5px;border-radius:30px}
.navi{height:46px;padding:0 22px;border-radius:23px;font-size:17px;font-weight:600;display:flex;align-items:center;gap:10px;color:var(--tx)}
.navi.on{background:var(--btn);color:var(--btx)}
.topr{position:absolute;right:36px;top:24px;display:flex;gap:12px;align-items:center}
.ava{width:44px;height:44px;border-radius:22px;background:linear-gradient(135deg,#7c9cff,#c48bff);flex:none}
#top-tv{position:fixed;left:0;right:0;top:0;height:100px;z-index:20;pointer-events:none}
#top-tv>*{pointer-events:auto}
.capsule{position:absolute;left:36px;top:28px;display:flex;align-items:center;gap:8px}
.capb{height:46px;padding:0 20px 0 7px;border-radius:23px;display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600}
.capb .ic{width:32px;height:32px;border-radius:16px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
body.light .capb .ic{background:rgba(0,0,0,.08)}
.clock{position:absolute;right:36px;top:28px;height:46px;padding:0 7px 0 18px;border-radius:23px;display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600}
.clock .ava{width:32px;height:32px}
#side{position:fixed;left:30px;top:22px;bottom:22px;width:320px;border-radius:34px;padding:16px 12px;z-index:40;transform:translateX(-380px);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:6px}
#side.open{transform:none}
#side .navi{width:100%;justify-content:flex-start;height:54px;font-size:19px;border-radius:27px}
#shade{position:fixed;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55),transparent 70%);z-index:30;opacity:0;pointer-events:none;transition:opacity .3s}
#shade.on{opacity:1;pointer-events:auto}
/* ── баннер ── */
.hero{position:relative;height:88vh;min-height:620px;overflow:hidden}
.hero .bgimg{position:absolute;inset:-40px;background-size:cover;background-position:center 20%;filter:blur(28px) saturate(1.3) brightness(.75);transform:scale(1.1)}
.hero .poster{position:absolute;right:10%;top:12%;height:66%;aspect-ratio:2/3;border-radius:24px;background-size:cover;background-position:center;box-shadow:0 40px 90px rgba(0,0,0,.6)}
.hero .fade{position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,rgba(11,11,14,.6) 40%,rgba(11,11,14,0) 70%),linear-gradient(0deg,var(--bg) 0%,rgba(11,11,14,0) 40%)}
body.light .hero .fade{background:linear-gradient(90deg,rgba(230,235,221,.95) 0%,rgba(230,235,221,.5) 40%,rgba(0,0,0,0) 70%),linear-gradient(0deg,rgba(230,235,221,1) 0%,rgba(0,0,0,0) 40%)}
.hero .desc{max-width:640px}
.hero .txt{position:absolute;left:72px;bottom:16%;width:min(860px,62%);display:flex;flex-direction:column;gap:14px}
.htitle{font-size:clamp(44px,6vw,86px);font-weight:900;line-height:.95;letter-spacing:-2px;text-transform:uppercase}
body.glassy .htitle{text-transform:none;letter-spacing:-2.5px}
.meta{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;flex-wrap:wrap}
.age{border:1.5px solid currentColor;border-radius:5px;padding:0 5px;font-size:13px;font-weight:700;line-height:18px;opacity:.8}
.rate{padding:2px 8px;border-radius:6px;background:var(--chip);font-size:15px;font-weight:700}
.desc{font-size:17px;line-height:1.5;color:var(--mu)}
.dots{position:absolute;left:0;right:0;bottom:6%;display:flex;justify-content:center;gap:8px}
.dots b{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.4);cursor:pointer}
.dots b.on{width:24px;background:#fff}
/* ── полки ── */
.shelf{padding:0 0 0 72px;margin-top:34px}
.shelf h3{margin:0 0 14px;font-size:24px;font-weight:700;color:var(--mu)}
body.glassy .shelf h3{color:var(--tx)}
.row-sc{display:flex;gap:24px;overflow-x:auto;padding:16px 72px 26px 6px;margin-left:-6px;scroll-behavior:smooth}
.row-sc::-webkit-scrollbar{height:0}
.card{flex:none;position:relative;border-radius:16px;overflow:hidden;background:#222 center/cover;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.card.p{width:190px;height:285px}
.card.l{width:300px;height:169px}
.card .num{position:absolute;left:10px;top:2px;font-size:56px;font-weight:800;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7);letter-spacing:-2px}
.card .gen{position:absolute;left:0;right:0;bottom:0;padding:40px 10px 12px;text-align:center;font-size:15px;font-weight:600;color:rgba(255,255,255,.75);background:linear-gradient(0deg,rgba(0,0,0,.75),transparent)}
.card.f .gen{color:#fff}
.card .cm{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 10px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent)}
.card .bar{width:30px;height:3px;border-radius:2px;background:rgba(255,255,255,.35);position:relative;flex:none}
.card .bar i{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:2px}
.card .nm{position:absolute;left:10px;right:10px;top:40%;text-align:center;font-weight:900;font-size:20px;color:#fff;text-transform:uppercase;z-index:0;opacity:.0}
.card.noimg .nm{opacity:1}
.card .rt{position:absolute;right:8px;top:8px;padding:2px 7px;border-radius:7px;background:rgba(0,0,0,.6);font-size:13px;font-weight:700;color:#fff}
.under{margin-top:8px;font-size:15px;font-weight:600;width:190px}
.under small{display:block;color:var(--mu);font-weight:500}
body.tv .under{display:none}
.face{flex:none;width:140px;text-align:center}
.face .c{width:140px;height:140px;border-radius:70px;background:#333 center/cover;margin-bottom:10px}
.face b{display:block;font-size:16px}
.face small{color:var(--mu);font-size:14px}
/* ── страница каталога ── */
.ptitle{padding:120px 72px 6px;font-size:40px;font-weight:800;letter-spacing:-1px}
body.tv .ptitle{text-align:center;color:var(--mu);font-size:42px;font-weight:700}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:14px 72px 0;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:28px 24px;padding:24px 72px 80px}
.grid .card.p{width:100%;height:auto;aspect-ratio:2/3}
/* ── панели ── */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
.overlay.on{display:flex}
.dlg{width:min(760px,92vw);max-height:88vh;overflow:auto;border-radius:34px;padding:28px 30px}
.dlg::-webkit-scrollbar{width:0}
.lbl{font-size:15px;color:var(--mu);margin:18px 4px 10px}
.wrap{display:flex;flex-wrap:wrap;gap:10px}
.sidepanel{position:fixed;right:0;top:0;bottom:0;width:min(560px,92vw);z-index:50;padding:30px;overflow:auto;transform:translateX(100%);transition:transform .3s;border-radius:34px 0 0 34px}
.sidepanel.on{transform:none}
.row{display:flex;align-items:center;gap:14px;min-height:52px;padding:6px 22px;border-radius:26px;background:var(--chip);border:1px solid var(--st);font-size:18px;font-weight:600;margin-bottom:10px;width:100%;text-align:left}
.row .v{margin-left:auto;color:var(--mu);font-weight:500}
.row small{display:block;font-size:13px;color:var(--mu);font-weight:500}
.ep{flex:none;width:300px}
.ep .card{width:300px;height:169px}
.ep .t{padding:12px 14px;margin-top:8px;border-radius:16px}
body.tv .ep.f .t{background:rgba(255,220,180,.16);backdrop-filter:blur(20px)}
.ep .k{font-size:13px;color:var(--mu);font-weight:600;letter-spacing:.5px}
.ep .n{font-size:17px;font-weight:700;margin:2px 0}
.ep .d{font-size:14px;color:var(--mu);line-height:1.35}
/* ── плеер ── */
#player{position:fixed;inset:0;z-index:60;background:#000;display:none;color:#fff}
#player.on{display:block}
#player .scene{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.55) blur(2px);transform:scale(1.04)}
#player .ui{position:absolute;inset:0;transition:opacity .3s}
#player .ui.hide{opacity:0}
.pctl{display:flex;justify-content:center;align-items:center;gap:30px;position:absolute;left:0;right:0;top:42%}
.pc{border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(40,40,46,.5);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.16)}
.pc.big{background:#f5f5f7}
.pbottom{position:absolute;left:72px;right:72px;bottom:36px}
.ptrack{height:6px;border-radius:3px;background:rgba(255,255,255,.25);position:relative;margin-top:18px;cursor:pointer}
.ptrack i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#fff}
.ptime{display:flex;justify-content:space-between;font-size:15px;font-weight:600;color:rgba(255,255,255,.8);margin-top:8px}
.pbtns{display:flex;gap:12px;align-items:center;margin-top:12px}
.pb{height:44px;padding:0 20px;border-radius:22px;background:rgba(50,50,56,.55);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.14);font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;color:#fff}
.pr{width:52px;height:52px;border-radius:26px;background:rgba(50,50,56,.55);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;color:#fff}
.pr.on{background:#f5f5f7;color:#111}
.ppanel{position:absolute;right:56px;bottom:230px;width:420px;max-height:62vh;overflow:auto;border-radius:30px;padding:14px 12px;background:rgba(70,60,52,.6);backdrop-filter:blur(36px) saturate(1.4);border:1px solid rgba(255,255,255,.16);display:none}
.ppanel.on{display:block}
.ppanel::-webkit-scrollbar{width:0}
.sec{font-size:14px;color:rgba(255,255,255,.55);padding:10px 16px 6px}
.opt{display:flex;align-items:center;gap:12px;min-height:46px;padding:4px 16px;border-radius:23px;font-size:17px;font-weight:600;width:100%;text-align:left;color:#fff}
.opt .ck{width:18px;flex:none}
.opt small{display:block;font-size:13px;color:rgba(255,255,255,.55);font-weight:500}
body.glassy .opt.f{background:rgba(255,255,255,.18)}
.sep{height:1px;background:rgba(255,255,255,.14);margin:6px 16px}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);padding:14px 24px;border-radius:22px;z-index:99;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
/* переключатель стиля */
#styler{position:fixed;right:18px;bottom:16px;z-index:100;display:flex;gap:6px;padding:6px;border-radius:26px;background:rgba(20,20,24,.8);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 30px rgba(0,0,0,.5)}
#styler button{height:38px;padding:0 16px;border-radius:19px;font-size:14px;font-weight:700;color:#fff}
#styler button.on{background:#fff;color:#111}
#help{position:fixed;right:22px;bottom:72px;z-index:100;font-size:12px;color:rgba(255,255,255,.5);max-width:220px;text-align:right}
body.light #help{color:rgba(0,0,0,.45)}
</style>
</head>

   + `<div style="margin-top:auto"><button class="navi" data-f data-go="settings">${I.gear}Настройки</button></div>`;
  const html = isTitle ? pages.title(pg.split(':')[1]) : pages[pg]();

function go(p){ if(p===state.page) return; state.stack.push(state.page); state.page=p; closeSide(); render(); }
function back(){
  if(document.getElementById('player').classList.contains('on')){closePlayer();return}
  if(document.getElementById('ov').classList.contains('on')){closeOv();return}
  if(document.getElementById('sp').classList.contains('on')){closeSp();return}

function openSide(){document.getElementById('side').classList.add('open');document.getElementById('shade').classList.add('on');setTimeout(()=>{const on=document.querySelector('#side .navi.on')||document.querySelector('#side .navi');setF(on)},50)}

let F=null;
function setF(el){ if(F) F.classList.remove('f'); F=el; if(el){el.classList.add('f'); el.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'}); if(el.closest('.card,.ep,.face')) el.closest('.page')?.scrollBy; } }
function scope(){
  if(document.getElementById('player').classList.contains('on')) return document.getElementById('player');
  if(document.getElementById('ov').classList.contains('on')) return document.getElementById('ov');
  if(document.getElementById('sp').classList.contains('on')) return document.getElementById('sp');
  if(document.getElementById('side').classList.contains('open')) return document.getElementById('side');
  return document;
}
function focusables(){
  const s=scope();
  return [...s.querySelectorAll('[data-f]')].filter(e=>{ if(s===document && e.closest('#side,#ov,#sp,#player,#styler')) return false; const r=e.getBoundingClientRect(); return r.width>0&&r.height>0&&getComputedStyle(e).visibility!=='hidden'&&e.offsetParent!==null; });
}
function focusFirst(){ const l=focusables(); const pri=l.find(e=>e.classList.contains('pri'))||l.find(e=>!e.closest('#top-tv,#top-glassy'))||l[0]; setF(pri); }
function move(dx,dy){
  const l=focusables(); if(!F||!l.includes(F)){focusFirst();return}
  const a=F.getBoundingClientRect(), ax=a.left+a.width/2, ay=a.top+a.height/2;
  let best=null,bs=1e9;
  for(const e of l){ if(e===F) continue; const b=e.getBoundingClientRect(), bx=b.left+b.width/2, by=b.top+b.height/2;
    const ddx=bx-ax, ddy=by-ay;
    if(dx&&Math.sign(ddx)!==dx) continue; if(dy&&Math.sign(ddy)!==dy) continue;
    if(dx&&Math.abs(ddx)<4) continue; if(dy&&Math.abs(ddy)<4) continue;
    const main=dx?Math.abs(ddx):Math.abs(ddy), cross=dx?Math.abs(ddy):Math.abs(ddx);
    const sc=main+cross*(dy?0.6:3); if(sc<bs){bs=sc;best=e} }
  if(best) setF(best);
  else if(dx===-1 && state.style==='tv' && scope()===document) openSide();
  else if(dy===-1 && scope()===document) app.querySelector('.page').scrollTo({top:0});
}
document.addEventListener('keydown',e=>{
  if(e.target.id==='q' && !['ArrowDown','Escape','Enter'].includes(e.key)) return;
  const k=e.key;
  if(document.getElementById('player').classList.contains('on')) pokeUi();
  if(k==='ArrowLeft'){move(-1,0);e.preventDefault()}
  else if(k==='ArrowRight'){move(1,0);e.preventDefault()}
  else if(k==='ArrowUp'){move(0,-1);e.preventDefault()}
  else if(k==='ArrowDown'){move(0,1);e.preventDefault()}
  else if(k==='Enter'||k===' '){ if(F){F.click();e.preventDefault()} }
  else if(k==='Escape'||k==='Backspace'){ if(e.target.id==='q'&&k==='Backspace') return; back();e.preventDefault()}
});

  const subsP=()=>`<div class="sec">Субтитры</div>${['Выключены','Русские','Русские (полные)','Английские'].map(m=>opt('sub',m,'',s.sub===m)).join('')}`;
  const setP=()=>`<div class="sec">Качество</div>${opt('q','1080p','текущая раздача',s.q==='1080p')}${opt('q','4K','другая раздача · 38 ГБ',s.q==='4K')}${opt('q','720p','другая раздача · 3.9 ГБ',s.q==='720p')}<div class="sep"></div><div class="sec">Аудиоформат</div>${opt('fmt','Авто','',1)}${opt('fmt','Dolby Atmos / DTS на ресивер','',0)}<div class="sep"></div><div class="sec">Скорость</div>${['0.75×','Обычная','1.25×','1.5×'].map(v=>opt('speed',v,'',s.speed===v)).join('')}${x.s?`<div class="sep"></div><div class="sec">Заставка</div>${opt('intro','Начало заставки — здесь','',0)}${opt('intro','Конец заставки — здесь','',0)}`:''}`;
  if(s.panel==='audio') panel=audioP(); else if(s.panel==='subs') panel=subsP(); else if(s.panel==='set') panel = tv?setP(): `<div class="sec">Дубляж</div>${opt('voice','Дубляж','',s.voice==='Дубляж')}${opt('voice','Оригинал: английский','',s.voice==='Оригинал: английский')}${opt('alt','LostFilm','другая раздача · 1080p',s.voice==='LostFilm')}<div class="sep"></div>`+subsP()+'<div class="sep"></div>'+setP()+'<div class="sep"></div><div class="sec">Режим звука</div>'+['Обычный','Ночной','Чёткие голоса'].map(m=>opt('mode',m,'',s.mode===m)).join('');
  document.getElementById('pui').innerHTML = `<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4),transparent 25%,transparent 55%,rgba(0,0,0,.75))"></div>`+center+bottom+`<div class="ppanel ${s.panel?'on':''}" style="${!tv?'right:40px;top:110px;bottom:150px;max-height:none;background:rgba(30,30,36,.7)':''}">${panel}</div>`;
  const pu=document.getElementById('pui');
  pu.querySelectorAll('[data-pact]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const a=b.dataset.pact;
    if(a==='pp'){s.play=!s.play;drawPlayer();setF(document.querySelector('#pui .pc.big'))}
    if(a==='rw'){s.pos=Math.max(0,s.pos-10);toast('−10 секунд')} if(a==='ff'){s.pos+=10;toast('+10 секунд')}
    if(a==='prev')toast('Предыдущая серия'); if(a==='next')toast('Следующая серия'); if(a==='close')closePlayer(); pokeUi();});
  pu.querySelectorAll('[data-panel]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const p=b.dataset.panel;if(p==='pip'){toast('Картинка в картинке');return}s.panel=s.panel===p?null:p;drawPlayer();setF(document.querySelector('#pui .ppanel [data-f]')||document.querySelector(`#pui [data-panel="${p}"]`));pokeUi()});
  pu.querySelectorAll('[data-opt]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const g=b.dataset.opt,v=b.dataset.val;
    if(g==='mode')s.mode=v; if(g==='sub')s.sub=v; if(g==='speed')s.speed=v; if(g==='voice')s.voice=v; if(g==='intro')toast('Отмечено: '+v);
    if(g==='q'){ if(v!==s.q){ toast(`Переключаю на ${v}… продолжим с ${fmt(s.pos)}`); } s.q=v; }
    if(g==='alt'){ toast(`Переключаю на «${v}»… продолжим с ${fmt(s.pos)}`); s.voice=v; }
    drawPlayer(); setF(document.querySelector(`#pui [data-opt="${g}"][data-val="${v}"]`)); });
  const tr=pu.querySelector('[data-seek]'); tr.onclick=ev=>{const r=tr.getBoundingClientRect();s.pos=(ev.clientX-r.left)/r.width*s.dur;drawPlayer()};
}

// ── Стиль и часы ────────────────────────────────────────────
document.querySelectorAll('#styler [data-style]').forEach(b=>b.addEventListener('click',()=>{}));
function clock(){const d=new Date();document.getElementById('clk').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
clock(); setInterval(clock,20000);
const st=document.createElement('style');st.textContent='@keyframes spin{to{transform:rotate(360deg)}}';document.head.appendChild(st);
render();
// Если картинки Кинопоиска недоступны — показываем названия на цветных карточках
const probe=new Image();probe.onerror=()=>document.head.insertAdjacentHTML('beforeend','<style>.card .nm{opacity:1}</style>');probe.src=P(301);
</script>
