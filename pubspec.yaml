name: deep_cinema
description: "Deep Cinema — личный онлайн-кинотеатр для Windows и Android TV."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  http: ^1.2.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  window_manager: '>=0.4.3 <0.6.0'
  tray_manager: '>=0.2.3 <0.3.0'
  media_kit: '>=1.1.11 <2.0.0'
  media_kit_video: '>=1.2.5 <3.0.0'
  media_kit_libs_video: '>=1.0.5 <2.0.0'
  youtube_explode_dart: '>=3.1.0 <4.0.0'
  qr_flutter: ^4.1.0
  file_selector: ^1.0.3
  ffi: ^2.1.0
  yaml: ^3.1.2
  html: ^0.15.4
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/sfx/
    - assets/trackers/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
